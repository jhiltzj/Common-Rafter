<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Roof Framing Calculator</title><style>body{font-family:Arial,sans-serif;background:#f4f6f8;margin:20px}.container{max-width:1100px;margin:auto}.card{background:#fff;border-radius:10px;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.1)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}label{display:block;font-weight:bold;margin-bottom:5px}input{width:100%;padding:8px;border:1px solid #ccc;border-radius:5px;box-sizing:border-box}.result{padding:12px;border-bottom:1px solid #ddd}.value{color:#006400;font-weight:bold}</style></head><body><div class="container"><h1>Roof Framing Calculator</h1><div class="card"><h2>Required Parameters</h2><div class="grid"><div><label>Length of Building</label><input type="text" id="length"></div><div><label>Width of Building</label><input type="text" id="width"></div><div><label>Projection of Wall</label><input type="text" id="wallProjection"></div><div><label>Roof Slope Rise</label><input type="number" id="rise" step="any"></div><div><label>Roof Slope Run</label><input type="number" id="run" step="any"></div><div><label>Projection of Roof</label><input type="text" id="roofProjection"></div></div></div><div class="card"><div class="result"><b>90° SGF</b><br><span id="sgf90" class="value">Waiting...</span></div><div class="result"><b>45° SGF</b><br><span id="sgf45" class="value">Waiting...</span></div><div class="result"><b>Common Rafter Line Length</b><br><span id="rafterLength" class="value">Waiting...</span></div><div class="result"><b>Common Rafter Overhang</b><br><span id="overhang" class="value">Waiting...</span></div><div class="result"><b>Total Rafter Line Length</b><br><span id="totalLength" class="value">Waiting...</span></div></div></div><script>function parseFeet(v){if(!v)return null;v=v.trim();if(v==='' )return null;if(!isNaN(v))return parseFloat(v);const m=v.match(/(\d+(?:\.\d+)?)\s*'?\s*(\d*(?:\.\d+)?)?\s*"?/);if(m){return (parseFloat(m[1])||0)+((parseFloat(m[2])||0)/12)}return null}function f(ft){return ft.toFixed(4)+' ft ('+(ft*12).toFixed(4)+' in)'}function calc(){const w=parseFeet(width.value);const rp=parseFeet(roofProjection.value);const riseV=parseFloat(rise.value);const runV=parseFloat(run.value);if(riseV>0&&runV>0){const sgf90v=Math.sqrt(Math.pow(riseV/runV,2)+1);const sgf45v=Math.sqrt(Math.pow(riseV/runV,2)+2);sgf90.innerHTML=sgf90v.toFixed(6);sgf45.innerHTML=sgf45v.toFixed(6);if(w!=null){const rl=w*sgf90v;rafterLength.innerHTML=f(rl);if(rp!=null){const oh=rp*sgf90v;overhang.innerHTML=f(oh);totalLength.innerHTML=f(rl+oh)}}}}document.querySelectorAll('input').forEach(i=>i.addEventListener('input',calc));</script></body></html>
